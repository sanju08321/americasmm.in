<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AmericaSMM</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-slate-800/50 backdrop-blur-md border border-slate-700/50 rounded-2xl p-8 shadow-2xl">
        <!-- Brand/Logo Header -->
        <div class="text-center mb-8">
            <a href="index.html" class="text-2xl font-bold tracking-wider text-emerald-400">AmericaSMM</a>
            <h2 class="text-xl font-semibold mt-2 text-slate-200">Create your ecosystem account</h2>
        </div>

        <!-- Registration Form -->
        <form action="#" method="POST" class="space-y-4" onsubmit="event.preventDefault();">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Full Name</label>
                <input type="text" placeholder="John Doe" required 
                       class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-emerald-500 text-white placeholder-slate-500 transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Email Address</label>
                <input type="email" placeholder="you@example.com" required 
                       class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-emerald-500 text-white placeholder-slate-500 transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Password</label>
                <input type="password" placeholder="Min. 8 characters" required 
                       class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-emerald-500 text-white placeholder-slate-500 transition">
            </div>

            <div class="flex items-start gap-2 pt-1">
                <input type="checkbox" id="terms" required class="mt-1 accent-emerald-500">
                <label for="terms" class="text-xs text-slate-400 leading-normal">
                    I agree to the <a href="#" class="text-emerald-400 hover:underline">Terms of Service</a> and <a href="#" class="text-emerald-400 hover:underline">Privacy Policy</a>.
                </label>
            </div>

            <button type="submit" class="w-full py-3 bg-emerald-500 text-slate-900 font-bold rounded-xl hover:bg-emerald-400 transition mt-2 cursor-pointer">
                Create Free Account
            </button>
        </form>

        <!-- Back to login link -->
        <p class="text-sm text-center text-slate-400 mt-6">
            Already have an account? <a href="login.html" class="text-emerald-400 hover:underline font-medium">Log in instead</a>
        </p>
    </div>

</body>
</html>
