<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AmericaSMM</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-slate-800/50 backdrop-blur-md border border-slate-700/50 rounded-2xl p-8 shadow-2xl">
        <!-- Brand/Logo Header -->
        <div class="text-center mb-8">
            <a href="index.html" class="text-2xl font-bold tracking-wider text-emerald-400">AmericaSMM</a>
            <h2 class="text-xl font-semibold mt-2 text-slate-200">Sign in to your account</h2>
        </div>

        <!-- Authentication Form -->
        <form action="#" method="POST" class="space-y-5" onsubmit="event.preventDefault();">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Email Address</label>
                <input type="email" placeholder="you@example.com" required 
                       class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-emerald-500 text-white placeholder-slate-500 transition">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm font-medium text-slate-400">Password</label>
                    <a href="#" class="text-xs text-emerald-400 hover:underline">Forgot password?</a>
                </div>
                <input type="password" placeholder="••••••••" required 
                       class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-emerald-500 text-white placeholder-slate-500 transition">
            </div>

            <button type="submit" class="w-full py-3 bg-emerald-500 text-slate-900 font-bold rounded-xl hover:bg-emerald-400 transition cursor-pointer">
                Sign In
            </button>
        </form>

        <!-- Divider line -->
        <div class="relative my-6 text-center">
            <span class="absolute inset-x-0 top-1/2 h-px bg-slate-700"></span>
            <span class="relative bg-slate-800 px-3 text-xs text-slate-500 uppercase tracking-wider">Or secure integration</span>
        </div>

        <!-- GitHub Auth Button (matches your current app layout) -->
        <a href="https://github.com" class="w-full py-3 bg-slate-900 hover:bg-slate-950 border border-slate-700 rounded-xl font-medium transition flex items-center justify-center gap-3 cursor-pointer">
            <!-- Simplified Github Inline SVG -->
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
            Continue with GitHub
        </a>

        <!-- Sign up Redirect -->
        <p class="text-sm text-center text-slate-400 mt-6">
            Don't have an account yet? <a href="register.html" class="text-emerald-400 hover:underline font-medium">Create one here</a>
        </p>
    </div>

</body>
</html>
